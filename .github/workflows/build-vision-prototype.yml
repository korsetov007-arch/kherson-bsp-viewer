name: Build BSP Vision (Windows)

on:
  push:
    paths:
      - "vision-prototype/**"
      - ".github/workflows/build-vision-prototype.yml"
  pull_request:
    paths:
      - "vision-prototype/**"
      - ".github/workflows/build-vision-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsp-vision-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S vision-prototype -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test BSP parser
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows app
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build/Release"
          $exePath = Join-Path $releaseDir "bsp-vision.exe"
          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe"
          & $windeployqt --release --no-translations $exePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $opencvBin = Join-Path $env:GITHUB_WORKSPACE "build/vcpkg_installed/x64-windows/bin"
          if (Test-Path $opencvBin) {
            Get-ChildItem $opencvBin -Filter "*.dll" | Copy-Item -Destination $releaseDir -Force
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: bsp-vision-windows-x64
          path: build/Release/
          if-no-files-found: error
