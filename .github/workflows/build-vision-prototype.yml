name: Build BSP Geometry Tools (Windows)

on:
  push:
    paths:
      - "vision-prototype/**"
      - ".github/workflows/build-vision-prototype.yml"
  pull_request:
    paths:
      - "vision-prototype/**"
      - ".github/workflows/build-vision-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsp-geometry-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S vision-prototype -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test BSP parser
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows app
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build/Release"
          $exePath = Join-Path $releaseDir "bsp-geometry.exe"
          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe"
          & $windeployqt --release --no-translations $exePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: bsp-geometry-windows-x64
          path: build/Release/
          if-no-files-found: error
